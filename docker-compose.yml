services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enron_db}
      POSTGRES_USER: ${POSTGRES_USER:-enron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enron2026}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
